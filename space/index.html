<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghana Chat — Knowledge Graph Grounded Multi-Turn AI</title>
  <meta name="description" content="Ghana Chat: Multi-turn conversational question answering strictly grounded on a Ghanaian Knowledge Graph powered by Qwen 2B on NVIDIA H200.">
  <style>
    :root {
      --bg: #f7f5ef;
      --card-bg: #ffffff;
      --text: #1a1915;
      --muted: #6b665c;
      --border: #e2ded4;
      --primary: #006b3f;       /* Ghana green */
      --primary-hover: #005230;
      --primary-light: #e6f4ea;
      --gold: #fcd116;          /* Ghana gold */
      --red: #ce1126;           /* Ghana red */
      --chip-bg: #ece8dd;
      --chip-hover: #dfdacb;
      --code-bg: #f4f0e6;
      --user-msg-bg: #006b3f;
      --user-msg-text: #ffffff;
      --bot-msg-bg: #ffffff;
      --badge-followup-bg: #e8f0fe;
      --badge-followup-text: #1a73e8;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --card-bg: #1e1d1a;
        --text: #edeae2;
        --muted: #a39e93;
        --border: #33302a;
        --primary: #00995a;
        --primary-hover: #00b368;
        --primary-light: #1b3323;
        --chip-bg: #2b2824;
        --chip-hover: #38342e;
        --code-bg: #262420;
        --user-msg-bg: #00874e;
        --user-msg-text: #ffffff;
        --bot-msg-bg: #1e1d1a;
        --badge-followup-bg: #192a3e;
        --badge-followup-text: #70aaff;
        --shadow: 0 4px 24px rgba(0,0,0,0.4);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app-wrapper {
      width: 100%;
      max-width: 860px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.75rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .header-left h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .header-badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-new-chat {
      background: var(--chip-bg);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-new-chat:hover { background: var(--chip-hover); }

    /* Messages Stream */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Chat Bubbles */
    .msg-row {
      display: flex;
      width: 100%;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 82%;
      border-radius: 16px;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      box-shadow: var(--shadow);
    }
    .msg-row.user .bubble {
      background: var(--user-msg-bg);
      color: var(--user-msg-text);
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .bubble {
      background: var(--bot-msg-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .bubble-text {
      white-space: pre-wrap;
    }

    /* Meta Badges inside Assistant Bubble */
    .bubble-meta {
      margin-top: 0.6rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.76rem;
    }
    .badge-tag {
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .badge-followup {
      background: var(--badge-followup-bg);
      color: var(--badge-followup-text);
    }
    .badge-retrieved {
      background: var(--primary-light);
      color: var(--primary);
    }
    .badge-speed {
      color: var(--muted);
    }

    /* Collapsible Triples Drawer */
    details.triples-drawer {
      margin-top: 0.65rem;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem 0.8rem;
      font-size: 0.82rem;
    }
    details.triples-drawer summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--muted);
      user-select: none;
    }
    details.triples-drawer summary:hover { color: var(--text); }
    .drawer-list {
      margin-top: 0.5rem;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-height: 220px;
      overflow-y: auto;
    }
    .drawer-item {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.78rem;
      background: var(--card-bg);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .th-head { font-weight: 700; color: var(--primary); }
    .th-rel { color: var(--muted); padding: 0 0.25rem; }
    .th-tail { color: var(--text); }

    /* Welcome Card / Quick Chips */
    .welcome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      margin: auto 0;
      box-shadow: var(--shadow);
    }
    .welcome-card h2 {
      font-size: 1.4rem;
      margin-bottom: 0.4rem;
    }
    .welcome-card p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }
    .chip {
      background: var(--chip-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .chip:hover { background: var(--chip-hover); }

    /* Input Footer */
    footer {
      padding: 0.75rem 0.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .input-bar {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.85rem 1.1rem;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--primary); }
    button.btn-send {
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 0 1.5rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button.btn-send:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .api-endpoint-field {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 4px;
      padding: 0.15rem 0.4rem;
      font-size: 0.75rem;
      width: 220px;
    }

    .spinner {
      display: inline-block;
      width: 0.9rem;
      height: 0.9rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <header>
      <div class="header-left">
        <span>🇬🇭</span>
        <h1>Ghana Chat</h1>
        <span class="header-badge">Multi-Turn • KG Grounded</span>
      </div>
      <div class="header-right">
        <button id="btn-clear" class="btn-new-chat">New Chat</button>
      </div>
    </header>

    <div id="chat-messages" class="chat-messages">
      <div id="welcome" class="welcome-card">
        <h2>Welcome to Ghana Chat</h2>
        <p>Ask questions and converse naturally. Follow-ups automatically reuse established facts without redundant retrieval.</p>
        <div class="chips">
          <button class="chip" data-q="Who is the chairperson of the NDPC, and where is its headquarters located?">NDPC Chairperson & HQ</button>
          <button class="chip" data-q="What is the National Development Planning Commission in Ghana?">National Development Planning Commission</button>
          <button class="chip" data-q="What type of document is the development agenda?">Development Agenda</button>
          <button class="chip" data-q="What is the Coordinated Programme for Social and Economic Development?">Coordinated Programme</button>
        </div>
      </div>
    </div>

    <footer>
      <form id="chat-form" class="input-bar">
        <input type="text" id="query-input" placeholder="Type your question or follow-up..." required autocomplete="off" />
        <button type="submit" id="btn-submit" class="btn-send">Send</button>
      </form>
      <div class="footer-sub">
        <span>Grounded by Qwen 2B on NVIDIA H200</span>
        <span>
          Backend: <input type="text" id="endpoint-input" class="api-endpoint-field" value="" placeholder="http://localhost:8000" />
        </span>
      </div>
    </footer>
  </div>

  <script>
    // Conversation State across turns
    let chatHistory = [];              // [{role: 'user', content: '...'}, {role: 'assistant', content: '...'}]
    let historyEntities = [];          // list of accumulated entity strings
    let conversationTriples = [];      // list of accumulated knowledge graph facts

    const chatMessages = document.getElementById('chat-messages');
    const welcomeCard = document.getElementById('welcome');
    const chatForm = document.getElementById('chat-form');
    const queryInput = document.getElementById('query-input');
    const btnSubmit = document.getElementById('btn-submit');
    const btnClear = document.getElementById('btn-clear');
    const endpointInput = document.getElementById('endpoint-input');

    // Restore or set backend endpoint
    const DEFAULT_API = 'https://ghana-chat.ghanaopenai.org';
    const savedEndpoint = localStorage.getItem('ghana_chat_endpoint');
    if (savedEndpoint) {
      endpointInput.value = savedEndpoint;
    } else {
      endpointInput.value = DEFAULT_API;
    }
    endpointInput.addEventListener('change', () => {
      localStorage.setItem('ghana_chat_endpoint', endpointInput.value.trim());
    });

    // Handle Quick Chips
    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        queryInput.value = btn.getAttribute('data-q');
        chatForm.dispatchEvent(new Event('submit'));
      });
    });

    // Reset Chat
    btnClear.addEventListener('click', () => {
      chatHistory = [];
      historyEntities = [];
      conversationTriples = [];
      chatMessages.innerHTML = '';
      chatMessages.appendChild(welcomeCard);
      welcomeCard.style.display = 'block';
      queryInput.focus();
    });

    // Form Submission
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = queryInput.value.trim();
      if (!message) return;

      if (welcomeCard && welcomeCard.parentElement) {
        welcomeCard.style.display = 'none';
      }

      // 1. Render User Message
      appendMessage('user', message);
      queryInput.value = '';
      queryInput.focus();

      // Disable submit while processing
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span class="spinner"></span>';

      // Create placeholder assistant row for streaming/loading
      const loadingRow = appendMessage('assistant', 'Consulting Ghanaian Knowledge Graph...');

      const base = endpointInput.value.trim().replace(/\/+$/, '');

      try {
        const payload = {
          message: message,
          history: chatHistory,
          history_entities: historyEntities,
          conversation_triples: conversationTriples
        };

        const res = await fetch(`${base}/ask`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          throw new Error(`API error ${res.status}: ${await res.text()}`);
        }

        const data = await res.json();

        // Update state
        chatHistory.push({ role: 'user', content: message });
        chatHistory.push({ role: 'assistant', content: data.answer });
        historyEntities = data.all_entities || historyEntities;
        conversationTriples = data.all_triples || conversationTriples;

        // Render response in the assistant bubble
        updateAssistantBubble(loadingRow, data);

      } catch (err) {
        loadingRow.querySelector('.bubble-text').innerHTML =
          `<span style="color:var(--red);">Error connecting to backend: ${err.message}. Please verify the API server is running at ${base}.</span>`;
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Send';
        scrollBottom();
      }
    });

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = `<div class="bubble-text">${escapeHtml(text)}</div>`;
      row.appendChild(bubble);
      chatMessages.appendChild(row);
      scrollBottom();
      return row;
    }

    function updateAssistantBubble(row, data) {
      const bubble = row.querySelector('.bubble');
      bubble.innerHTML = `<div class="bubble-text">${escapeHtml(data.answer)}</div>`;

      // Meta Badges
      const meta = document.createElement('div');
      meta.className = 'bubble-meta';

      if (data.is_followup) {
        meta.innerHTML += `<span class="badge-tag badge-followup">⚡ Context Follow-up (Zero New Retrieval)</span>`;
      } else if (data.new_triples && data.new_triples.length > 0) {
        meta.innerHTML += `<span class="badge-tag badge-retrieved">🔍 Retrieved ${data.new_triples.length} new facts</span>`;
      }

      meta.innerHTML += `<span class="badge-speed">${data.latency_s}s • ${data.tokens_per_sec} tok/s</span>`;
      bubble.appendChild(meta);

      // Collapsible Knowledge Graph Drawer
      const trs = data.all_triples || [];
      if (trs.length > 0) {
        const details = document.createElement('details');
        details.className = 'triples-drawer';
        const isFollow = data.is_followup;
        details.innerHTML = `
          <summary>Active Knowledge Graph Context (${trs.length} head facts)</summary>
          <ul class="drawer-list">
            ${trs.map(t => `
              <li class="drawer-item">
                <span class="th-head">${escapeHtml(t.head)}</span>
                <span class="th-rel">| ${escapeHtml(t.relation)} |</span>
                <span class="th-tail">${escapeHtml(t.tail)}</span>
              </li>
            `).join('')}
          </ul>
        `;
        bubble.appendChild(details);
      }
    }

    function scrollBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }
  </script>
</body>
</html>
